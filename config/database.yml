default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5450) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "ajackus") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  <<: *default
  database: ajackus_task_manager_development

test:
  <<: *default
  database: ajackus_task_manager_test

production:
  <<: *default
  database: ajackus_task_manager_production
